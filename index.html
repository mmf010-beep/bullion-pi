<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bullion Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 650px;
      margin: auto;
      padding: 45px 20px;
    }
    h1 {
      color: #D4AF37;
      font-size: 46px;
    }
    p {
      color: #aaa;
      font-size: 20px;
      line-height: 1.7;
    }
    .card {
      margin-top: 35px;
      padding: 28px;
      border: 2px solid #D4AF37;
      border-radius: 18px;
      background: #222;
    }
    .badge {
      display: inline-block;
      background: #D4AF37;
      color: #111;
      padding: 8px 22px;
      border-radius: 25px;
      font-weight: bold;
    }
    .price {
      margin: 22px 0;
      color: #D4AF37;
      font-size: 36px;
      font-weight: bold;
      direction: ltr;
    }
    button {
      margin-top: 15px;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #D4AF37;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    #pay-btn {
      display: none;
    }
    #status {
      margin-top: 18px;
      color: #ddd;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Bullion Pi</h1>
    <p>المقاصة الرقمية ومؤشر الذهب الذكي على شبكة Pi Network</p>

    <h3 id="user-welcome" style="color:#D4AF37;"></h3>

    <div class="card">
      <span class="badge">مباشر من البورصة العالمية</span>
      <div class="price" id="gold-price">جاري تحميل السعر...</div>

      <p>نسخة اختبارية للتسجيل والتفاعل داخل Pi Browser.</p>

      <button id="login-btn">تسجيل الدخول بواسطة Pi</button>
      <button id="pay-btn">طلب مقاصة / دفع بواسطة Pi</button>

      <div id="status">افتح التطبيق من داخل Pi Browser ثم اضغط تسجيل الدخول.</div>
    </div>
  </div>

  <script>
    const loginBtn = document.getElementById("login-btn");
    const payBtn = document.getElementById("pay-btn");
    const statusBox = document.getElementById("status");
    const welcome = document.getElementById("user-welcome");
    const goldPrice = document.getElementById("gold-price");

    let currentUser = null;

    function status(message) {
      statusBox.innerText = message;
    }

    setTimeout(function () {
      goldPrice.innerText = "$2,350.45 / أونصة";
    }, 700);

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment:", payment);
      status("تم العثور على عملية دفع غير مكتملة.");
    }

    window.onload = function () {
      if (!window.Pi) {
        status("Pi SDK غير متاح. افتح التطبيق من داخل Pi Browser.");
        return;
      }

      try {
        Pi.init({
          version: "2.0",
          sandbox: true
        });
        status("جاهز للتسجيل عبر Pi.");
      } catch (error) {
        console.error(error);
        status("حدث خطأ أثناء تهيئة Pi SDK.");
      }
    };

    loginBtn.onclick = function () {
      if (!window.Pi) {
        status("افتح التطبيق من داخل Pi Browser أولاً.");
        return;
      }

      status("جاري تسجيل الدخول...");
      loginBtn.disabled = true;

      Pi.authenticate(["username", "payments"], onIncompletePaymentFound)
        .then(function (auth) {
          currentUser = auth.user;
          welcome.innerText = "مرحباً بك: " + currentUser.username;
          loginBtn.style.display = "none";
          payBtn.style.display = "inline-block";
          status("تم تسجيل الدخول بنجاح.");
        })
        .catch(function (error) {
          console.error(error);
          loginBtn.disabled = false;
          status("تعذر تسجيل الدخول. تأكد أنك داخل Pi Browser وأن التطبيق في وضع الاختبار.");
        });
    };

   const BACKEND_URL = "https://bullion-pi.onrender.com";

payBtn.onclick = function () {
  if (!currentUser) {
    status("سجل الدخول أولاً.");
    return;
  }

  status("جاري فتح نافذة الدفع عبر Pi...");
  payBtn.disabled = true;

  Pi.createPayment({
    amount: 0.01,
    memo: "Bullion Pi test payment",
    metadata: {
      app: "Bullion Pi",
      user: currentUser.username,
      type: "test-clearing"
    }
  }, {
    onReadyForServerApproval: function(paymentId) {
      fetch(BACKEND_URL + "/approve", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ paymentId: paymentId })
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        console.log("Approval:", data);
        status("تم اعتماد طلب الدفع من الخادم. أكمل الدفع في نافذة Pi.");
      })
      .catch(function(error) {
        console.error(error);
        status("فشل اعتماد الدفع من الخادم.");
        payBtn.disabled = false;
      });
    },

    onReadyForServerCompletion: function(paymentId, txid) {
      fetch(BACKEND_URL + "/complete", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          paymentId: paymentId,
          txid: txid
        })
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        console.log("Completion:", data);
        status("تم إكمال الدفع بنجاح.");
        payBtn.disabled = false;
      })
      .catch(function(error) {
        console.error(error);
        status("فشل إكمال الدفع.");
        payBtn.disabled = false;
      });
    },

    onCancel: function(paymentId) {
      console.log("Payment cancelled:", paymentId);
      status("تم إلغاء الدفع.");
      payBtn.disabled = false;
    },

    onError: function(error, payment) {
      console.error("Payment error:", error, payment);
      status("حدث خطأ أثناء عملية الدفع.");
      payBtn.disabled = false;
    }
  });
};
  </script>
</body>
</html>
