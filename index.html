<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bullion Pi - منصة الذهب الرقمية</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>Pi.init({ version: "2.0", sandbox: true });</script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111111;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .container {
            padding: 50px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #D4AF37; /* لون الذهب الفخم */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .price-card {
            background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
            border: 2px solid #D4AF37;
            border-radius: 15px;
            display: inline-block;
            padding: 30px;
            margin-top: 30px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .price {
            font-size: 2.2rem;
            color: #D4AF37;
            font-weight: bold;
            margin: 15px 0;
        }
        .badge {
            background-color: #D4AF37;
            color: #111;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<div class="container">
        <h1>Bullion Pi</h1>
        <p>المقاصة الرقمية ومؤشر الذهب الذكي على شبكة Pi Network</p>

        <h3 id="user-welcome" style="color: #D4AF37; margin-top: 20px;"></h3>

        <div class="price-card">
            <span class="badge">مباشر من البورصة العالمية</span>
            <div class="price" id="gold-price">جاري تحميل السعر...</div>
            <p>التطبيق متوافق تماماً مع محفظة Pi وبإشراف قانوني كامل.</p>

            <button id="pay-btn" style="background-color: #D4AF37; color: #111; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; display: none;">
                طلب مقاصة / دفع بواسطة Pi
            </button>
        </div>
    </div>

    

    <script>
        // تهيئة اتصال الـ SDK الخاص بشبكة باي
        try {
            Pi.init({ version: "2.0", sandbox: true });
            console.log("Pi SDK initialized successfully.");
        } catch (e) {
            console.error("Pi SDK configuration required inside Pi Browser.");
        }

        // محاكاة سعر الذهب مؤقتاً حتى نربط الـ API الحي في الخطوات القادمة
        setTimeout(() => {
            document.getElementById('gold-price').innerText = "$2,350.45 / أونصة";
           
    const scopes = ['username', 'payments'];

    function onIncompletePaymentFound(payment) {
        console.log("Found incomplete payment:", payment);
    }

    // بدء عملية التحقق وعرض الزر والاسم
    Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
        console.log("تم تسجيل الدخول بنجاح للمستخدم: " + auth.user.username);
        
        // 1. عرض اسم المستخدم في الواجهة
        document.getElementById("user-welcome").innerText = "مرحباً بك: " + auth.user.username;
        
        // 2. إظهار زر الدفع بعد التأكد من تسجيل الدخول
        document.getElementById("pay-btn").style.display = "inline-block";
        
    }).catch(function(error) {
        console.error("خطأ في تسجيل الدخول:", error);
    });
</script>
        }, 1200);
    </script>
   <script>
    const scopes = ['username', 'payments'];

    function onIncompletePaymentFound(payment) {
        // هنا يتم معالجة المدفوعات المعلقة إذا وجدت
        console.log("Found incomplete payment:", payment);
    }

    // بدء عملية التحقق وتسجيل الدخول
    Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
        console.log("تم تسجيل الدخول بنجاح للمستخدم: " + auth.user.username);
        
        // 1. عرض اسم المستخدم في الواجهة
        document.getElementById("user-welcome").innerText = "مرحباً بك: " + auth.user.username;
        
        // 2. إظهار زر الدفع بعد التأكد من تسجيل الدخول
        document.getElementById("pay-btn").style.display = "inline-block";
        
    }).catch(function(error) {
        console.error("خطأ في تسجيل الدخول:", error);
    });
</script>
</body>
</html>
